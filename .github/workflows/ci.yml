name: Offline contracts and portability

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  posix-offline:
    name: Full offline suite (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --experimental-vm-modules proofs/windows-storage-lifecycle-contract.mjs
      - run: npm test
      - run: npm run validate
      - run: npm run replay

  windows-protocol:
    name: Windows portable contracts only (native hooks and storage unverified)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # This intentionally excludes /bin/sh invocation and POSIX file-mode tests.
      # Passing this job does not establish Windows hook or journal support.
      - name: Portable dispatch, package, and network-path refusal
        run: node --test --test-name-pattern="session notice|safe tool use|matched command|unknown event|compatibility manifest|every packaged|bundled skill|example configurations|state scope keys|Windows state" test/dispatcher.test.mjs test/package.test.mjs test/state.test.mjs
      - name: Portable replacement and decision contracts
        run: node --test test/contracts.test.mjs test/hold.test.mjs
      - name: POSIX state acquisition scheduler (clock simulation, not Windows storage)
        run: node --test test/state-lock-budget.test.mjs
      - name: Selected Git and scope contracts; restore privacy refusal
        run: node --test test/checkpoints.test.mjs test/scope.test.mjs test/restore.test.mjs test/usage.test.mjs test/observations.test.mjs test/impact.test.mjs test/impact-review.test.mjs
      - name: Local rendering contracts (simulated DOM, not native host)
        run: node --test test/rendering.test.mjs test/observers.test.mjs test/appearance.test.mjs
      - name: Bounded static PE parser (synthetic bytes, no image loading)
        run: node --test test/pe-inventory.test.mjs test/pin-diagnostic-frame.test.mjs test/directory-diagnostic-frame.test.mjs test/linked-inventory-frame.test.mjs test/owned-fixture-lifecycle.test.mjs
      - name: Generated authoring fixtures and offline CLI (synthetic data, no installation)
        run: node --test test/scaffold.test.mjs
      - name: Component pure contracts and actual Windows before-IO refusal (POSIX IO cases skip)
        run: node --test test/components.test.mjs test/interactions.test.mjs test/agents.test.mjs
      - name: Synthetic routing driver only (fixed Node peer, no Codex or inference)
        run: node --test test/routing-driver.test.mjs
      - name: Native routing preparation only (closed execution, no Codex or inference)
        run: node --test test/routing-native.test.mjs test/routing-native-hooks.test.mjs
      - name: Readiness inspector fixed peers only (native entry closed, no Codex or inference)
        run: node --test test/readiness.test.mjs
      - name: Inspection-only contract and closed entry (POSIX peer cases skip, no native client)
        run: node --test test/inspection.test.mjs
      - name: Offline reliability contracts (five POSIX probes skip, no native client)
        run: node --test test/reliability.test.mjs test/process-group-observation.test.mjs
      - name: Retention Windows before-IO refusal (POSIX cleanup cases skip)
        run: node --test test/retention.test.mjs
      - run: npm run validate
      - run: npm run replay

  windows-private-storage:
    name: Windows NTFS storage integration (not Codex host acceptance)
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: WS-L1 simulated failure lifecycle (no real helper)
        run: node --experimental-vm-modules proofs/windows-storage-lifecycle-contract.mjs
      - name: Independent fixed-output PowerShell startup and selected OS environment
        run: node test/windows-startup.mjs
      - name: Compile original public helper source under Windows PowerShell5.1
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -File test/windows-compile.ps1
      - name: Synthetic copied-helper fixed-stage IPC trace (no file content or env values)
        run: node test/windows-ipc.mjs
      - name: Real NTFS ACL, public storage APIs, cancellation and synthetic hook subprocess
        run: node --test test/windows-storage.test.mjs test/state-observer-boundary.test.mjs test/windows-lock-contention.test.mjs
      - name: Copied-helper state refusal trace (diagnosis only, fixed labels, fresh synthetic roots)
        if: always()
        run: node proofs/windows-state-trace.mjs
      - name: Isolated job-list lifetime proof (not production Git or Codex acceptance)
        env:
          # Explicit fixed root documented by actions/runner-images Install-Git.ps1.
          # Read-only object/static import inventory, never execute or trust Git.
          CODEX_MODS_CI_GIT_ROOT: 'C:\Program Files\Git'
          # Explicit reviewed modern family; missing targets fail, no probing fallback.
          CODEX_MODS_CI_GIT_LAYOUT: 'git-for-windows-ucrt64-v1'
        run: node --test test/windows-owned-process.test.mjs
